name: Update Meetup Data

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Run Meetup Sync Script
      run: node scripts/sync-meetup.mjs
      
    - name: Commit and Push changes
      run: |
        git config --global user.name "Grafana & Friends Mumbai"
        git config --global user.email "grafanamumbai@gmail.com"
        git add src/data/community-data.json
        if ! git diff --staged --quiet; then
          git commit -m "chore: sync Meetup event data"
          git push
        else
          echo "No changes to commit."
        fi
